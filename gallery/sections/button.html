<section>
  <h2>Buttons</h2>

  <h3>Accent (Primary)</h3>
  <button class="ds-btn ds-btn--accent">Accent Button</button>

  <h3>Secondary</h3>
  <button class="ds-btn ds-btn--secondary">Secondary Button</button>

  <h3>Ghost</h3>
  <button class="ds-btn ds-btn--ghost">Ghost Button</button>

  <h3>Danger</h3>
  <button class="ds-btn ds-btn--danger">Delete</button>

  <h3>Small Size</h3>
  <button class="ds-btn ds-btn--accent ds-btn--sm">Small Button</button>

  <h3>Disabled State</h3>
  <button class="ds-btn ds-btn--accent" disabled>Disabled Button</button>

  <h3>Loading State</h3>
  <button class="ds-btn ds-btn--accent" data-loading>Loading...</button>

  <h3>Icon Button</h3>
  <button class="ds-iconbtn" aria-label="Close">✕</button>

  <h3>Link</h3>
  <a href="#" class="ds-link">Link Text</a>
</section>
