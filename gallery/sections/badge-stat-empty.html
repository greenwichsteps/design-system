<section>
  <h2>Badges, Stats & Empty State</h2>

  <h3>Badges</h3>

  <h4>Default</h4>
  <span class="ds-badge">Default Badge</span>

  <h4>Accent</h4>
  <span class="ds-badge ds-badge--accent">Accent Badge</span>

  <h4>Success</h4>
  <span class="ds-badge ds-badge--success">Success Badge</span>

  <h4>Danger</h4>
  <span class="ds-badge ds-badge--danger">Danger Badge</span>

  <h3>Stats</h3>
  <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--ds-space-5);">
    <div class="ds-stat">
      <div class="ds-stat__value">42.5K</div>
      <div class="ds-stat__label">Total Users</div>
    </div>
    <div class="ds-stat">
      <div class="ds-stat__value">98%</div>
      <div class="ds-stat__label">Uptime</div>
    </div>
  </div>

  <h3>Empty State</h3>
  <div class="ds-empty">
    <div class="ds-empty__title">No results found</div>
    <p>Try adjusting your filters or search terms</p>
    <button class="ds-btn ds-btn--accent">Clear Filters</button>
  </div>
</section>
